name: swing-alert

on:
  schedule:
    # Shanba va yakshanba o'tkazib yuboriladi (Actions daqiqalari tejaladi). Vaqt UTC.
    - cron: "*/10 * * * 1-4"       # Dushanba - Payshanba: kun bo'yi
    - cron: "*/10 0-21 * * 5"      # Juma: bozor yopilguncha (22:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swing-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python swing_alert.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: Save state
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "state" && git push)
      - name: Telegramga xato haqida xabar
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT=$(printf '⚠️ Swing alert bot xato berdi\n%s' "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode text="${TEXT}"

name: swing-alert

on:
  schedule:
    - cron: 3,13,23,33,43,53 * * * *
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swing-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: pip
      - run: pip install -r requirements.txt
      - run: python swing_alert.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: Save state
        run: git config user.name github-actions; git config user.email actions@users.noreply.github.com; git add state.json; git commit -m state && git push || echo skip
